  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interactive Card Form</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Space Grotesk', sans-serif;
}

body{
    height:100vh;
    background:#0a0f1f;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:1200px;
    height:650px;
    background:white;
    display:flex;
    overflow:hidden;
    border-radius:12px;
}

/* ================= LEFT ================= */

.left{
    width:35%;
    background:linear-gradient(180deg,#32004d,#1d002b);
    position:relative;
}

/* FRONT CARD */

.front-card{
    width:420px;
    height:230px;
    border-radius:15px;
    position:absolute;
    top:120px;
    left:130px;

    background:
    radial-gradient(circle at top right,#ff8a65,#c850c0 30%,transparent 60%),
    radial-gradient(circle at bottom center,#4facfe,#7b2ff7 40%,transparent 70%),
    linear-gradient(135deg,#5f2cff,#7b00b6);

    box-shadow:0 15px 30px rgba(0,0,0,0.3);

    padding:30px;
    color:white;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:50px;
}

.logo .big{
    width:45px;
    height:45px;
    background:white;
    border-radius:50%;
}

.logo .small{
    width:18px;
    height:18px;
    border:1px solid white;
    border-radius:50%;
}

.card-number{
    font-size:34px;
    letter-spacing:4px;
    margin-bottom:35px;
}

.bottom{
    display:flex;
    justify-content:space-between;
    font-size:15px;
    letter-spacing:2px;
}

/* BACK CARD */

.back-card{
    width:420px;
    height:230px;
    background:#e7e7eb;
    border-radius:15px;
    position:absolute;
    top:360px;
    left:250px;

    box-shadow:0 15px 30px rgba(0,0,0,0.2);
}

.black-strip{
    width:100%;
    height:55px;
    background:#222;
    margin-top:25px;
}

.cvc-box{
    width:80%;
    height:40px;
    background:#adb5bd;
    margin:35px auto;
    border-radius:5px;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding-right:15px;
    color:white;
    letter-spacing:2px;
}

/* ================= RIGHT ================= */

.right{
    width:65%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.form-box{
    width:380px;
}

label{
    display:block;
    margin-bottom:10px;
    color:#21092f;
    font-size:14px;
    font-weight:600;
    letter-spacing:2px;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #d2d3d9;
    border-radius:10px;
    margin-bottom:25px;
    font-size:18px;
    outline:none;
}

input:focus{
    border:1px solid #5f2cff;
}

input::placeholder{
    color:#9e8ca8;
}

.row{
    display:flex;
    gap:20px;
}

.date{
    display:flex;
    gap:10px;
}

.date input{
    width:80px;
}

.cvc-input{
    flex:1;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:10px;
    background:#21092f;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#3a1152;
}

</style>
</head>

<body>

<div class="container">

    <!-- LEFT -->

    <div class="left">

        <!-- FRONT CARD -->

        <div class="front-card">

            <div class="logo">
                <div class="big"></div>
                <div class="small"></div>
            </div>

            <div class="card-number" id="cardNumber">
                0000 0000 0000 0000
            </div>

            <div class="bottom">
                <span id="cardName">JANE APPLESEED</span>
                <span id="cardDate">00/00</span>
            </div>

        </div>

        <!-- BACK CARD -->

        <div class="back-card">

            <div class="black-strip"></div>

            <div class="cvc-box">
                <span id="cardCvc">000</span>
            </div>

        </div>

    </div>

    <!-- RIGHT -->

    <div class="right">

        <div class="form-box">

            <label>CARDHOLDER NAME</label>
            <input
            type="text"
            id="nameInput"
            placeholder="e.g. Jane Appleseed">

            <label>CARD NUMBER</label>
            <input
            type="text"
            id="numberInput"
            maxlength="19"
            placeholder="e.g. 1234 5678 9123 0000">

            <div class="row">

                <div>

                    <label>EXP. DATE (MM/YY)</label>

                    <div class="date">

                        <input
                        type="text"
                        id="monthInput"
                        maxlength="2"
                        placeholder="MM">

                        <input
                        type="text"
                        id="yearInput"
                        maxlength="2"
                        placeholder="YY">

                    </div>

                </div>

                <div class="cvc-input">

                    <label>CVC</label>

                    <input
                    type="text"
                    id="cvcInput"
                    maxlength="3"
                    placeholder="e.g. 123">

                </div>

            </div>

            <button id="confirmBtn">
                Confirm
            </button>

        </div>

    </div>

</div>

<script>

/* ================= INPUTS ================= */

const nameInput = document.getElementById("nameInput");
const numberInput = document.getElementById("numberInput");
const monthInput = document.getElementById("monthInput");
const yearInput = document.getElementById("yearInput");
const cvcInput = document.getElementById("cvcInput");

/* ================= CARD TEXT ================= */

const cardName = document.getElementById("cardName");
const cardNumber = document.getElementById("cardNumber");
const cardDate = document.getElementById("cardDate");
const cardCvc = document.getElementById("cardCvc");

/* ================= NAME ================= */

nameInput.addEventListener("input", () => {

    if(nameInput.value === ""){
        cardName.textContent = "JANE APPLESEED";
    }
    else{
        cardName.textContent = nameInput.value.toUpperCase();
    }

});

/* ================= CARD NUMBER ================= */

numberInput.addEventListener("input", () => {

    let value = numberInput.value.replace(/\D/g,'');

    value = value.replace(/(.{4})/g,'$1 ').trim();

    cardNumber.textContent = value;

    if(value === ""){
        cardNumber.textContent = "0000 0000 0000 0000";
    }

});

/* ================= DATE ================= */

function updateDate(){

    let month = monthInput.value || "00";
    let year = yearInput.value || "00";

    cardDate.textContent = `${month}/${year}`;
}

monthInput.addEventListener("input", updateDate);
yearInput.addEventListener("input", updateDate);

/* ================= CVC ================= */

cvcInput.addEventListener("input", () => {

    if(cvcInput.value === ""){
        cardCvc.textContent = "000";
    }
    else{
        cardCvc.textContent = cvcInput.value;
    }

});

/* ================= BUTTON ================= */

document.getElementById("confirmBtn").addEventListener("click", () => {

    if(
        nameInput.value === "" ||
        numberInput.value === "" ||
        monthInput.value === "" ||
        yearInput.value === "" ||
        cvcInput.value === ""
    ){
        alert("Please fill all fields");
    }
    else{
        alert("Card Added Successfully");
    }

});

</script>

</body>
</html>
    
  </body>
  
</html>
